name: Build Re-ARranged Artifacts

on:
  workflow_dispatch:

concurrency:
  group: build-test
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Mod Source
        uses: actions/checkout@v4
        with:
          repository: edward9s/Shattered-Master-Mode
          path: mod

      - name: Resolve Versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="Hoto-Mocha/Re-ARranged-Pixel-Dungeon"
          UPSTREAM_TAG=$(gh api "repos/$REPO/releases/latest" --jq '.tag_name // empty')
          if [ -z "$UPSTREAM_TAG" ]; then
            echo "::error::Unable to resolve the latest upstream release tag."
            exit 1
          fi

          MOD_VER=$(python mod/scripts/extract_version.py mod/core/src/main/java/com/spd/mod/ModGame.java)
          if [ -z "$MOD_VER" ]; then
            echo "::error::Unable to resolve the SMM version."
            exit 1
          fi
          EXPECTED_TAG="Re-ARranged-${UPSTREAM_TAG}-m${MOD_VER}"
          echo "UPSTREAM_TAG=$UPSTREAM_TAG" >> "$GITHUB_ENV"
          echo "MOD_VER=$MOD_VER" >> "$GITHUB_ENV"
          echo "EXPECTED_TAG=$EXPECTED_TAG" >> "$GITHUB_ENV"
          echo "UPSTREAM_REPO=$REPO" >> "$GITHUB_ENV"
          echo "Resolved $EXPECTED_TAG"
      - name: Checkout Re-ARranged Source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_TAG }}
          path: spd_src

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      - name: Patch & Merge
        run: |
          python mod/scripts/rebase_source.py spd_src mod
          python mod/scripts/patch_android.py spd_src
          python mod/scripts/inject_mod.py spd_src
          
          cp -a mod/core spd_src/ 2>/dev/null || true
          cp -a mod/android spd_src/ 2>/dev/null || true
          cp -a mod/desktop spd_src/ 2>/dev/null || true
          cp -a mod/assets spd_src/ 2>/dev/null || true
          
          python mod/scripts/patch_depth.py 31

          # 解決 AAPT: error: resource string/game_services_project_id not found
          mkdir -p spd_src/android/src/main/res/values
          cat <<EOF > spd_src/android/src/main/res/values/secrets.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="game_services_project_id">000000000000</string>
          </resources>
          EOF

      - name: Compile
        working-directory: ./spd_src
        run: |
          chmod +x ./gradlew
          ./gradlew android:assembleRelease :desktop:release

      - name: Install Old Build Tools for Signer
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;29.0.3"

      - name: Sign Android
        uses: r0adkll/sign-android-release@v1
        id: sign
        with:
          releaseDirectory: spd_src/android/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Package
        run: |
          mkdir -p out
          
          APK_NAME="${{ env.EXPECTED_TAG }}-Android.apk"
          JAR_NAME="${{ env.EXPECTED_TAG }}-Java.jar"
          
          cp "${{ steps.sign.outputs.signedReleaseFile }}" "out/$APK_NAME"
          
          COMPILED_JAR=$(find spd_src/desktop/build/libs -name "desktop-*.jar" | head -n 1)
          if [ -n "$COMPILED_JAR" ]; then
            cp "$COMPILED_JAR" "out/$JAR_NAME"
          else
            echo "Error: Compiled desktop JAR not found"
            exit 1
          fi
      - name: Verify test build files
        shell: bash
        run: |
          set -euo pipefail
          test -f "out/${EXPECTED_TAG}-Android.apk"
          test -f "out/${EXPECTED_TAG}-Java.jar"
          test "$(find out -maxdepth 1 -type f | wc -l)" -eq 2

      - name: Publish rolling test release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_TAG: build-test
        run: |
          set -euo pipefail
          notes=$(printf 'Latest successful manual test build.\n\nBuild commit: %s\nUpstream: %s\nSMM: m%s\n' \
            "$GITHUB_SHA" "$UPSTREAM_TAG" "$MOD_VER")
          if gh release view "$TEST_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TEST_TAG" out/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TEST_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Test build" --notes "$notes" --prerelease
          else
            gh release create "$TEST_TAG" out/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Test build" \
              --notes "$notes" \
              --prerelease \
              --latest=false
          fi

          # Remove APK/JAR files from obsolete test builds.
          while IFS='|' read -r asset_id asset_name; do
            case "$asset_name" in
              *.apk|*.jar)
                if [[ ! -f "out/$asset_name" ]]; then
                  gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
                fi
                ;;
            esac
          done < <(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TEST_TAG" \
            --jq '.assets[] | "\(.id)|\(.name)"')

          # Keep the test tag at the commit that produced the latest test files.
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TEST_TAG" \
            -f sha="$GITHUB_SHA" -F force=true >/dev/null
          actual_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TEST_TAG" --jq '.object.sha')
          test "$actual_sha" = "$GITHUB_SHA"
